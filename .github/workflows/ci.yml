# Runs on every push and pull request. Tests use committed fixtures and block the network.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -r requirements.lock

      - run: python -m pytest

      - name: Load the fixtures into a DuckDB file
        run: python -m tests.fixtures.build_fixture_warehouse warehouse/fixture.duckdb

      # The fixtures cover one hour, so tests that need whole days have nothing to check.
      - name: dbt build on the fixtures
        working-directory: dbt_project
        run: |
          cp profiles.yml.example profiles.yml
          dbt build --profiles-dir . --target fixture
