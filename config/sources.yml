user_agent: "nem-market-explainer/0.1 (personal research project; polite daily fetch)"
min_request_gap_seconds: 3

# Each entry is saved under data/raw/rba/<name>_<YYYYMMDD>.<ext> and loaded into raw.<table>.
# F11 history before 2023 is only published as .xls, one file per period.
rba:
  - {name: rba_f11_2014_2017, table: rba_f11, url: "https://www.rba.gov.au/statistics/tables/xls-hist/2014-2017.xls"}
  - {name: rba_f11_2018_2022, table: rba_f11, url: "https://www.rba.gov.au/statistics/tables/xls-hist/2018-2022.xls"}
  - {name: rba_f11_1_2023_current, table: rba_f11, url: "https://www.rba.gov.au/statistics/tables/csv/f11.1-data.csv"}
  - {name: rba_f1, table: rba_f1, url: "https://www.rba.gov.au/statistics/tables/csv/f1-data.csv"}
  - {name: rba_a2, table: rba_a2, url: "https://www.rba.gov.au/statistics/tables/csv/a2-data.csv"}

# Monthly MMSDM archive. Each table file is saved under data/raw/aemo/ and loaded into raw.aemo_<table>.
aemo:
  archive_url: "https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/"
  start_month: "2021-07"
  # Unit SCADA is about 4.4 million rows a month, so it can start later than the other tables.
  scada_start_month: "2021-07"
  regions: [NSW1, QLD1, SA1, TAS1, VIC1]

quality:
  # The archive is published about two weeks after each month ends.
  max_dispatch_age_days: 50
