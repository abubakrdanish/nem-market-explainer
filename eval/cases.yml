  # June 2022 suspension
  - id: june_nsw1_20220613
    group: june_2022
    region: NSW1
    date: 2022-06-13
    supported: >
      Before the suspension. Average $839/MWh; 9 intervals at the $15,100 cap; APC set in 174 intervals; maximum
      $15,100, minimum $200.
    not_supported: [energy crisis, coal outages, gas shortage, the APC lowered prices, the market was suspended]
    restraint: true
    say_unexplained: false
    caveats: []

  - id: june_nsw1_20220618
    group: june_2022
    region: NSW1
    date: 2022-06-18
    supported: >
      Suspended all 288 intervals; APC set in only 5; maximum exactly $300; no suspended interval above $300.
      The recorded finding says prices were held at or below about $300 for most of the suspension and neither
      flag explains it.
    not_supported: [the suspension lowered prices, the price cap lowered prices, AEMO set prices, energy crisis, gas shortage]
    restraint: true
    say_unexplained: true
    caveats: [june_2022_finding]

  - id: june_qld1_20220615
    group: june_2022
    region: QLD1
    date: 2022-06-15
    supported: >
      The suspension starts in the afternoon: 119 suspended intervals; APC set in all 288; maximum $299.62; the
      event "AEMO suspends the spot market in all NEM regions" is recorded for this date.
    not_supported: [the suspension lowered prices, the price cap lowered prices, energy crisis, generators withdrew]
    restraint: true
    say_unexplained: true
    caveats: [june_2022_finding]

  - id: june_tas1_20220618
    group: june_2022
    region: TAS1
    date: 2022-06-18
    supported: >
      Suspended all 288 intervals with APC never set; average $193, maximum $268. This is the case where the APC
      cannot be the explanation.
    not_supported: [the price cap held prices down, the suspension lowered prices, hydro made Tasmania cheap]
    restraint: true
    say_unexplained: true
    caveats: [june_2022_finding]

  - id: june_nsw1_20220624
    group: june_2022
    region: NSW1
    date: 2022-06-24
    supported: >
