# Evaluation cases for the explainer. Written on 2026-10-17 from the marts, before the explainer was run on any
# of them, and not revised after results were seen.
#
# Fields:
#   supported       what the evidence pack can support, in plain words
#   not_supported   causes or claims the pack cannot support; an answer making them fails "unsupported claims"
#   restraint       true when the right answer assigns no cause to the day's prices
#   say_unexplained true when the answer should say the evidence does not explain the move
#   caveats         caveats the answer must carry: rooftop_solar, june_2022_finding, series_break, missing_scada,
#                   unverified_suspension
# Notable rules and required statements are computed by the pack builder; every flagged rule must be mentioned.

cases:
  # Large price spikes
  - id: spike_vic1_20250612
    group: spike
    region: VIC1
    date: 2025-06-12
    supported: >
      Average $1,786/MWh against a 30-day median of $111; 40 high-price intervals from 16:55 to 21:25; one interval
      at the $17,500 cap at 19:55 with APC set. At 19:55 demand exceeded available generation and VIC1 was importing.
      Demand peaked at 07:50 at a much lower price.
    not_supported: [cold weather, generator outage, gas shortage, bidding behaviour, demand caused the price, the shortfall caused the price]
    restraint: true
    say_unexplained: false
    caveats: []

  - id: spike_nsw1_20240508
    group: spike
    region: NSW1
    date: 2024-05-08
    supported: >
      Average $3,554/MWh against a 30-day median of $94; 68 high-price intervals; one at the $16,600 cap; APC set in
      3 intervals; previous day also high at $886.
    not_supported: [cold weather, generator outage, coal plant failure, bidding behaviour, a named generator]
    restraint: true
    say_unexplained: false
    caveats: []

  - id: spike_sa1_20250702
    group: spike
    region: SA1
    date: 2025-07-02
    supported: >
      Average $1,999/MWh against a 30-day median of $146; 68 high-price intervals and 45 price jumps; maximum
      $15,104; no APC and no cap interval.
    not_supported: [low wind caused it, interconnector outage, weather, bidding behaviour]
    restraint: true
    say_unexplained: false
    caveats: []

  - id: spike_qld1_20260115
    group: spike
    region: QLD1
    date: 2026-01-15
    supported: >
      A short spike: 3 high-price intervals and 5 price jumps, maximum $19,728, while the day's average ($243) stayed
      far below the maximum. Previous day average $59, 30-day median $55.
    not_supported: [heatwave, storm, generator trip, bidding behaviour]
    restraint: true
    say_unexplained: false
    caveats: []

