[project]
name = "nem-market-explainer"
version = "0.1.0"
description = "National Electricity Market data pipeline: AEMO archive tables, RBA rates and an events calendar in DuckDB"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/abubakrdanish/nem-market-explainer"
Repository = "https://github.com/abubakrdanish/nem-market-explainer"
Issues = "https://github.com/abubakrdanish/nem-market-explainer/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
