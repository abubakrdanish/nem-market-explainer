[project]
name = "asx-market-explainer"
version = "0.1.0"
description = "ASX market data pipeline: RBA rates, user-supplied ASX prices and an events calendar in DuckDB"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
